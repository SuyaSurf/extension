<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Scheduler - Suya</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f8f9fa;
            color: #333;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 600;
        }
        
        .header p {
            margin: 10px 0 0;
            opacity: 0.9;
        }
        
        .content {
            padding: 30px;
        }
        
        .schedule-form {
            display: grid;
            gap: 20px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .form-group label {
            font-weight: 500;
            color: #555;
        }
        
        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        .schedule-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        
        .option-card {
            padding: 20px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .option-card:hover {
            border-color: #667eea;
            transform: translateY(-2px);
        }
        
        .option-card.selected {
            border-color: #667eea;
            background: #f8f9ff;
        }
        
        .option-card h3 {
            margin: 0 0 8px;
            color: #333;
        }
        
        .option-card p {
            margin: 0;
            color: #666;
            font-size: 14px;
        }
        
        .actions {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5a6fd8;
        }
        
        .btn-secondary {
            background: #e1e5e9;
            color: #333;
        }
        
        .btn-secondary:hover {
            background: #d1d5d9;
        }
        
        .scheduled-reviews {
            margin-top: 40px;
        }
        
        .review-item {
            padding: 15px;
            border: 1px solid #e1e5e9;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .review-info h4 {
            margin: 0 0 5px;
            color: #333;
        }
        
        .review-info p {
            margin: 0;
            color: #666;
            font-size: 14px;
        }
        
        .review-actions {
            display: flex;
            gap: 10px;
        }
        
        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
        }
        
        .btn-danger {
            background: #dc3545;
            color: white;
        }
        
        .btn-danger:hover {
            background: #c82333;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📅 Review Scheduler</h1>
            <p>Schedule regular QA reviews for your websites</p>
        </div>
        
        <div class="content">
            <div class="schedule-form">
                <div class="form-group">
                    <label for="site-url">Website URL</label>
                    <input type="url" id="site-url" placeholder="https://example.com" />
                </div>
                
                <div class="form-group">
                    <label for="review-name">Review Name</label>
                    <input type="text" id="review-name" placeholder="Weekly Homepage Review" />
                </div>
                
                <div class="form-group">
                    <label>Schedule Frequency</label>
                    <div class="schedule-options">
                        <div class="option-card" data-frequency="daily">
                            <h3>Daily</h3>
                            <p>Every day at the same time</p>
                        </div>
                        <div class="option-card" data-frequency="weekly">
                            <h3>Weekly</h3>
                            <p>Once per week</p>
                        </div>
                        <div class="option-card" data-frequency="biweekly">
                            <h3>Bi-weekly</h3>
                            <p>Every two weeks</p>
                        </div>
                        <div class="option-card" data-frequency="monthly">
                            <h3>Monthly</h3>
                            <p>Once per month</p>
                        </div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="schedule-time">Time</label>
                    <input type="time" id="schedule-time" value="09:00" />
                </div>
                
                <div class="form-group">
                    <label for="review-notes">Notes (optional)</label>
                    <textarea id="review-notes" placeholder="What to focus on during this review..."></textarea>
                </div>
                
                <div class="actions">
                    <button class="btn btn-primary" id="schedule-review-button">Schedule Review</button>
                    <button class="btn btn-secondary" id="clear-review-form-button">Clear</button>
                </div>
            </div>
            
            <div class="scheduled-reviews">
                <h2>Scheduled Reviews</h2>
                <div id="reviews-list">
                    <div class="empty-state">
                        <p>No reviews scheduled yet. Create your first review above!</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="review-scheduler.js"></script>
</body>
</html>
